name: Widget regression tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node 24 on Ubuntu
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      # No npm install: the suite uses only built-in Node modules.
      - run: npm run test:coverage
      - run: git diff --check
