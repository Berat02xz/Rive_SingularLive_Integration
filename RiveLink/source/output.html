<!doctype html>
<html>
  <head>
    <style>
      html,
      body {
        background: none;
        margin: 0;
        padding: 0;
        height: 100%;
        width: 100%;
        overflow: hidden;
      }
      #canvas {
        display: block;
        width: 100%;
        height: 100%;
        opacity: 0;
      }
      #canvas.ready {
        opacity: 1;
      }
    </style>
  </head>
  <body>
    <canvas id="canvas"></canvas>
    <div id="rive-fps-counter" style="display: none; position: absolute; top: 12px; left: 12px; background-color: black; color: white; font: 20px Gotham, sans-serif; border-radius: 8px; padding: 8px 12px; z-index: 1000;">FPS: --</div>

    <script src="https://beta.singular.live/libs/singularwidget/1.0.4/singularwidget.js"></script>

    <script>
    // =========================================================================
    // States and configuration
    // =========================================================================

    const widgetState = {
      riveProps: {},
      r: null,
      riveReady: false,
      artboardName: "",
      stateMachineName: "",
      layoutFit: "",
      fileUrl: "",
      runtime: "",
      stateMachineIndex: 0,
      _lastArtboardSelection: null,
      _lastStateMachineSelection: null,
      displayFpsCounter: false,
      pendingInitialValues: null,
      vmMetadata: {},
      defaultVMName: "",
      globalViewModelNames: [],
      _findVMNameForInstance: null,
      referencedFontAssets: {},  // fieldId → { asset, assetName }
      dataBoundFontProperties: {}, // fieldId → { accessor, propertyName, path }
      metricFontData: {},        // fieldId → { family, weight, subset }
      _fontApplyGeneration: {},  // fieldId → latest async apply generation
      fallbackFontWrappers: [],  // decoded fonts retained by RiveFont callback
      fallbackFontRuntime: null,
      referencedAudioAssets: {}, // fieldId → { asset, assetName }
      audioAssetUrls: {},        // fieldId → url string

      layoutOptions: [
        "Contain", "Cover", "Fill", "FitWidth", "FitHeight", "ScaleDown", "Layout", "None",
      ],
      runtimeSources: {
        webgl2: "https://unpkg.com/@rive-app/webgl2@2.44.0/rive.js",
        canvas: "https://unpkg.com/@rive-app/canvas@2.44.0/rive.js",
      },
    };

    // =========================================================================
    // Utilities
    // =========================================================================

    function toAlphanumericId(str) {
      return str.replace(/[^a-zA-Z0-9]/g, "");
    }

    function riveColorValueToRGBA(colorValue) {
      return {
        r: (colorValue >> 16) & 0xff,
        g: (colorValue >> 8) & 0xff,
        b: colorValue & 0xff,
        a: ((colorValue >> 24) & 0xff) / 255,
      };
    }

    const imageUrlHistory = {};
    const instanceImageUrls = new WeakMap();
    function normalizeImageUrl(url) {
      if (url.startsWith("//")) return "https:" + url;
      if (!/^(https?:|data:)/.test(url)) return "https://" + url;
      return url;
    }
    async function decodeImageFromUrl(url, runtime = window.rive) {
      const res = await fetch(url);
      if (!res.ok) throw new Error(`Image request failed: HTTP ${res.status}`);
      const image = await runtime.decodeImage(new Uint8Array(await res.arrayBuffer()));
      if (!image) throw new Error("Rive could not decode the image");
      return image;
    }

    function resumeAfterImageUpdate(instance) {
      if (instance && instance === widgetState.r) {
        // Resume after the async assignment, including when isPlaying is true.
        // play() preserves the existing state machine and its transition state.
        instance.play(widgetState.stateMachineName || undefined);
      }
    }

    // =========================================================================
    // Font loading — Singular MetricFont → Google API → GitHub → Inter
    // =========================================================================

    const FONT_FALLBACK_URL = "https://cdn.rive.app/runtime/flutter/inter.ttf";
    const fontBytesCache = new Map();
    let fallbackFontBytesPromise = null;

    function fetchFallbackFontBytes() {
      if (!fallbackFontBytesPromise) {
        fallbackFontBytesPromise = (async () => {
          const response = await fetch(FONT_FALLBACK_URL);
          if (!response.ok) throw new Error("Fallback font request failed");
          return new Uint8Array(await response.arrayBuffer());
        })();
        fallbackFontBytesPromise.catch(() => { fallbackFontBytesPromise = null; });
      }
      return fallbackFontBytesPromise;
    }

    // Weight number → static TTF style-name suffix used in the Google Fonts GitHub repo
    const WEIGHT_TO_STYLE_NAME = {
      "100": "Thin", "200": "ExtraLight", "300": "Light",
      "400": "Regular", "500": "Medium", "600": "SemiBold",
      "700": "Bold", "800": "ExtraBold", "900": "Black",
    };

    function fontAssetFieldId(assetName) {
      const base = assetName.replace(/\.[^.]+$/, "");
      return "rivefont" + base.replace(/[^a-zA-Z0-9]/g, "");
    }

    function dataBoundFontFieldId(propertyName) {
      return "rivefontprop" + propertyName.replace(/[^a-zA-Z0-9]/g, "");
    }

    function stableIdHash(value) {
      let hash = 2166136261;
      for (let i = 0; i < value.length; i++) {
        hash ^= value.charCodeAt(i);
        hash = Math.imul(hash, 16777619);
      }
      return (hash >>> 0).toString(36);
    }

    function globalViewModelFieldId(viewModelName, propertyPath, isFont) {
      const qualifiedName = `${viewModelName}/${propertyPath}`;
      const readableName = toAlphanumericId(qualifiedName);
      return `${isFont ? "rivefontglobal" : "riveglobal"}${readableName}${stableIdHash(qualifiedName)}`;
    }

    function globalViewModelGroupId(viewModelName) {
      return `riveglobal${toAlphanumericId(viewModelName)}${stableIdHash(viewModelName)}group`;
    }

    function parseFontFamilyFromAsset(assetName) {
      let name = assetName.replace(/\.[^.]+$/, "").replace(/\[.*?\]/g, "").trim();
      const lastDash = name.lastIndexOf("-");
      const familyPart = lastDash > 0 ? name.substring(0, lastDash) : name;
      return familyPart.replace(/([A-Z])/g, " $1").trim().replace(/\s+/g, " ");
    }

    const GFKey = "AIzaSyBMre41OpN9ISDJQaZFMp6YmyhlUJV8MfE";

    async function fetchGoogleFontBytes(family, weight) {
      const weightStr = String(weight);

      // Method 1: Google Fonts API
      try {
        const apiUrl = `https://www.googleapis.com/webfonts/v1/webfonts?key=${GFKey}&family=${encodeURIComponent(family)}`;
        const res = await fetch(apiUrl);
        if (res.ok) {
          const data = await res.json();
          const item = data.items && data.items[0];
          if (item && item.files) {
            const weightKey = weightStr === "400" ? "regular" : weightStr;
            const fontUrl = item.files[weightKey] || item.files["regular"];
            if (fontUrl) {
              // The Developer API may return http:// URLs; force HTTPS inside Singular.
              const fontRes = await fetch(fontUrl.replace(/^http:/, "https:"));
              if (fontRes.ok) {
                return new Uint8Array(await fontRes.arrayBuffer());
              }
            }
          }
        }
      } catch { }

      // Method 2: GitHub raw fallback
      const styleName = WEIGHT_TO_STYLE_NAME[weightStr] || "Regular";
      const familyCamel = family.replace(/\s+/g, "");
      const fontId = family.toLowerCase().replace(/\s+/g, "");
      const BASE = "https://raw.githubusercontent.com/google/fonts/main";
      const candidates = ["ofl", "apache", "ufl"].flatMap((lic) => [
        `${BASE}/${lic}/${fontId}/${familyCamel}-${styleName}.ttf`,
        `${BASE}/${lic}/${fontId}/static/${familyCamel}-${styleName}.ttf`,
      ]);

      for (const url of candidates) {
        try {
          const res = await fetch(url);
          if (res.ok) {
            return new Uint8Array(await res.arrayBuffer());
          }
        } catch { /* try next candidate */ }
      }

      throw new Error(`No TTF found for "${family}" wght ${weightStr} via API or GitHub`);
    }

    async function resolveFontBytes(metricData) {
      const family = metricData.family;
      const weight = String(metricData.weight != null ? metricData.weight : "400");
      const subset = metricData.subset != null ? metricData.subset : "auto";
      const cacheKey = `${family}|${weight}|${subset}`;

      if (!fontBytesCache.has(cacheKey)) {
        const request = (async () => {
          try {
            return await fetchGoogleFontBytes(family, weight);
          } catch {
            return fetchFallbackFontBytes();
          }
        })();
        fontBytesCache.set(cacheKey, request);
        request.catch(() => fontBytesCache.delete(cacheKey));
      }

      const cachedBytes = await fontBytesCache.get(cacheKey);
      return cachedBytes.slice();
    }

    async function fetchAndApplyFont(fieldId) {
      const fontInfo = widgetState.referencedFontAssets[fieldId];
      const boundInfo = widgetState.dataBoundFontProperties[fieldId];
      if ((!fontInfo || !fontInfo.asset) && (!boundInfo || !boundInfo.accessor)) return;

      const metricData = widgetState.metricFontData[fieldId];
      if (!metricData || !metricData.family) return;

      const capturedAsset = fontInfo ? fontInfo.asset : null;
      const capturedAccessor = boundInfo ? boundInfo.accessor : null;
      const applyGeneration = (widgetState._fontApplyGeneration[fieldId] || 0) + 1;
      widgetState._fontApplyGeneration[fieldId] = applyGeneration;

      let bytes;
      try {
        bytes = await resolveFontBytes(metricData);
      } catch {
        return;
      }

      let decoded = null;
      try {
        decoded = await window.rive.decodeFont(bytes);
      } catch {
        return;
      }

      if (!decoded) return;
      try {
        if (widgetState._fontApplyGeneration[fieldId] !== applyGeneration) return;

        const appliedTargets = [];
        const liveAssetInfo = widgetState.referencedFontAssets[fieldId];
        if (capturedAsset && liveAssetInfo && liveAssetInfo.asset === capturedAsset) {
          capturedAsset.setFont(decoded);
          appliedTargets.push("referenced-asset");
        }

        const liveBoundInfo = widgetState.dataBoundFontProperties[fieldId];
        if (capturedAccessor && liveBoundInfo && liveBoundInfo.accessor === capturedAccessor) {
          capturedAccessor.value = decoded;
          appliedTargets.push("data-bound-property");
        }

        if (appliedTargets.length > 0) {
          console.info("[RiveWidget][font] applied live", {
            fieldId,
            family: metricData.family,
            weight: metricData.weight,
            targets: appliedTargets,
          });
        }
      } catch { } finally {
        decoded.unref();
      }
    }

    function applyStoredDataBoundFonts() {
      for (const fieldId of Object.keys(widgetState.dataBoundFontProperties)) {
        if (widgetState.metricFontData[fieldId]) fetchAndApplyFont(fieldId);
      }
    }

    function releaseRiveGlyphFallbackFonts() {
      try {
        if (window.rive && window.rive.RiveFont) {
          window.rive.RiveFont.setFallbackFontCallback(null);
        }
      } catch {}
      for (const font of widgetState.fallbackFontWrappers) {
        try { font.unref(); } catch {}
      }
      widgetState.fallbackFontWrappers = [];
      widgetState.fallbackFontRuntime = null;
    }

    async function prepareRiveGlyphFallbackFonts() {
      if (!window.rive || !window.rive.RiveFont || typeof window.rive.RiveFont.setFallbackFontCallback !== "function") return;
      if (widgetState.fallbackFontRuntime === window.rive && widgetState.fallbackFontWrappers.length > 0) return;

      releaseRiveGlyphFallbackFonts();
      try {
        const fallbackFont = await window.rive.decodeFont(
          (await fetchFallbackFontBytes()).slice()
        );
        if (!fallbackFont) return;

        const retainedFallbacks = [fallbackFont];
        window.rive.RiveFont.setFallbackFontCallback(() => retainedFallbacks);
        widgetState.fallbackFontWrappers = retainedFallbacks;
        widgetState.fallbackFontRuntime = window.rive;
      } catch {}
    }

    // =========================================================================
    // Audio loading — URL fetch → Rive decodeAudio / setAudio
    // =========================================================================

    function audioAssetFieldId(assetName) {
      const base = assetName.replace(/\.[^.]+$/, "");
      return "riveaudio" + base.replace(/[^a-zA-Z0-9]/g, "");
    }

    // Audio assets can be surfaced by the runtime after onLoad has already
    // built the UI (the audio engine initializes asynchronously); regenerate
    // so late-registered assets still get their fields.
    function scheduleAssetUIRefresh() {
      console.log("[RiveWidget][audio] scheduleAssetUIRefresh called, riveReady =", widgetState.riveReady);
      if (!widgetState.riveReady) return; // onLoad will build the UI
      clearTimeout(widgetState._assetUIRefreshTimer);
      widgetState._assetUIRefreshTimer = setTimeout(() => {
        console.log("[RiveWidget][audio] regenerating UI for late-registered assets");
        if (widgetState.riveReady) generateUIModel();
      }, 100);
    }

    function normalizeAudioUrl(url) {
      if (url.startsWith("//")) return "https:" + url;
      if (!/^(https?:|data:)/.test(url)) return "https://" + url;
      return url;
    }

    // url → decoded AudioWrapper. Audio must be applied synchronously inside
    // assetLoader: Rive scripts (e.g. AudioSound) capture the audio source at
    // artboard init, so a late async setAudioSource is silently ignored.
    // The cache keeps its ref for the session, so no unref on apply.
    const audioDecodedCache = {};

    function releaseDecodedAudioCache() {
      for (const url of Object.keys(audioDecodedCache)) {
        try { audioDecodedCache[url].unref(); } catch {}
        delete audioDecodedCache[url];
      }
    }

    async function prefetchAudioAssets() {
      const urls = Object.values(widgetState.audioAssetUrls).filter(Boolean);
      await Promise.all(urls.map(async (rawUrl) => {
        const url = normalizeAudioUrl(rawUrl);
        if (audioDecodedCache[url]) return;
        try {
          const res = await fetch(url);
          if (!res.ok) return;
          const bytes = new Uint8Array(await res.arrayBuffer());
          const decoded = await window.rive.decodeAudio(bytes);
          if (decoded) {
            audioDecodedCache[url] = decoded;
            console.log("[RiveWidget][audio] prefetched + decoded", url);
          }
        } catch (e) {
          console.error("[RiveWidget][audio] prefetch failed", url, e);
        }
      }));
    }

    async function fetchAndApplyAudio(fieldId) {
      const audioInfo = widgetState.referencedAudioAssets[fieldId];
      const rawUrl = widgetState.audioAssetUrls[fieldId];
      console.log("[RiveWidget][audio] fetchAndApplyAudio", { fieldId, hasAsset: !!(audioInfo && audioInfo.asset), url: rawUrl });
      if (!audioInfo || !audioInfo.asset) return;

      if (!rawUrl) return;
      const url = normalizeAudioUrl(rawUrl);

      const capturedAsset = audioInfo.asset;

      let decoded = audioDecodedCache[url];
      if (!decoded) {
        let bytes;
        try {
          const res = await fetch(url);
          console.log("[RiveWidget][audio] fetch result", { url, status: res.status, ok: res.ok });
          if (!res.ok) return;
          bytes = new Uint8Array(await res.arrayBuffer());
          console.log("[RiveWidget][audio] fetched bytes:", bytes.length);
        } catch (e) {
          console.error("[RiveWidget][audio] fetch failed", url, e);
          return;
        }

        try {
          decoded = await window.rive.decodeAudio(bytes);
          console.log("[RiveWidget][audio] decodeAudio result:", decoded);
        } catch (e) {
          console.error("[RiveWidget][audio] decodeAudio failed", e);
          return;
        }
        if (!decoded) return;
        audioDecodedCache[url] = decoded;
      }

      try {
        if (!widgetState.referencedAudioAssets[fieldId] || widgetState.referencedAudioAssets[fieldId].asset !== capturedAsset) {
          console.warn("[RiveWidget][audio] asset went stale before apply, skipping", fieldId);
          return;
        }
        capturedAsset.setAudioSource(decoded);
        console.log("[RiveWidget][audio] setAudioSource applied for", fieldId);
      } catch (e) {
        console.error("[RiveWidget][audio] setAudioSource failed", e);
      }
    }

    // =========================================================================
    // Runtime — WebGL2 / Canvas toggle
    // =========================================================================

    function waitForRiveGlobal() {
      return new Promise((resolve, reject) => {
        const start = Date.now();
        const timer = setInterval(() => {
          if (window.rive && typeof window.rive.Rive === 'function') {
            clearInterval(timer);
            resolve();
          } else if (Date.now() - start > 5000) {
            clearInterval(timer);
            reject(new Error('Timed out waiting for Rive global'));
          }
        }, 50);
      });
    }

    async function toggleRiveRuntime(desiredRuntime) {
      // Serialize: if another switch is already in flight, wait for it to finish
      // before checking state. This prevents two concurrent toggles from racing
      // (e.g. onInit and onSingularValue both calling this simultaneously).
      while (widgetState._runtimeSwitching) {
        await widgetState._runtimeSwitching;
      }

      if (widgetState.runtime === desiredRuntime && window.rive) {
        await prepareRiveGlyphFallbackFonts();
        return;
      }

      let switchResolve;
      widgetState._runtimeSwitching = new Promise(r => { switchResolve = r; });

      try {
        const existing = document.getElementById("rive-runtime-script");
        try {
          if (existing) existing.remove();
          if (widgetState.r) widgetState.r.cleanup();
          widgetState.r = null;
          widgetState.riveReady = false;
          widgetState.referencedFontAssets = {};
          widgetState.dataBoundFontProperties = {};
          widgetState.referencedAudioAssets = {};
          releaseRiveGlyphFallbackFonts();
          releaseDecodedAudioCache();
          delete window.rive;
        } catch {}

        const script = document.createElement("script");
        script.id = "rive-runtime-script";
        script.src = widgetState.runtimeSources[desiredRuntime];
        document.body.prepend(script);

        await new Promise((resolve, reject) => {
          script.onload = async () => {
            try {
              await waitForRiveGlobal();
              widgetState.runtime = desiredRuntime;
              await prepareRiveGlyphFallbackFonts();
              await prefetchAudioAssets();
              resolve();
            } catch (e) { reject(e); }
          };
          script.onerror = () => reject(new Error(`Failed to load ${desiredRuntime}`));
        });
      } finally {
        widgetState._runtimeSwitching = null;
        switchResolve();
      }
    }

    // =========================================================================
    // Canvas & FPS
    // =========================================================================

    function resizeCanvas() {
      const canvas = document.getElementById("canvas");
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      if (widgetState.r) widgetState.r.resizeDrawingSurfaceToCanvas();
    }

    window.addEventListener("resize", resizeCanvas);

    function ensureFPSCounter(instance) {
      const overlay = document.getElementById("rive-fps-counter");
      if (widgetState.displayFpsCounter) {
        overlay.style.display = "block";
        try {
          instance.enableFPSCounter((fps) => {
            if (widgetState.displayFpsCounter) {
              overlay.textContent = `FPS: ${Math.round(fps)}`;
            }
          });
        } catch {}
      } else {
        overlay.style.display = "none";
      }
    }

    // =========================================================================
    // ViewModel — read / write / discover
    // =========================================================================

    function readInstanceProperties(instance) {
      const obj = {};
      for (const _p of instance.properties) {
        // "__" marks internal convention slots (Save__/Update__ etc.); never expose
        // them in the generated default JSON shown in Singular.
        if (_p.name.includes("__")) continue;
        try {
          if (_p.type === "string")       obj[_p.name] = instance.string(_p.name) != null ? instance.string(_p.name).value : "";
          else if (_p.type === "number")  obj[_p.name] = instance.number(_p.name) != null ? instance.number(_p.name).value : 0;
          else if (_p.type === "boolean") obj[_p.name] = instance.boolean(_p.name) != null ? instance.boolean(_p.name).value : false;
          else if (_p.type === "color") {
            const colorAcc = instance.color(_p.name);
            if (colorAcc != null) {
              const rgba = riveColorValueToRGBA(colorAcc.value);
              const r = Math.round(rgba.r).toString(16).padStart(2, "0");
              const g = Math.round(rgba.g).toString(16).padStart(2, "0");
              const b = Math.round(rgba.b).toString(16).padStart(2, "0");
              obj[_p.name] = `#${r}${g}${b}`;
            }
          }
          else if (_p.type === "image") { obj[_p.name] = ""; }
        } catch {}
      }
      return obj;
    }

    function applyPropsToInstance(inst, itemData) {
      for (const key of Object.keys(itemData)) {
        // Underscore-prefixed fields are internal helpers (never written to the instance).
        if (key.startsWith('_')) continue;
        const val = itemData[key];
        try {
          if (typeof val === 'boolean') {
            const a = inst.boolean(key); if (a) a.value = val;
          } else if (typeof val === 'number') {
            const a = inst.number(key); if (a) a.value = val;
          } else if (typeof val === 'string') {
            const strAcc = inst.string(key);
            if (strAcc) { strAcc.value = val; continue; }
            // Hex color string (#rrggbb or #rrggbbaa)
            if (val.startsWith('#')) {
              const colorAcc = inst.color(key);
              if (colorAcc) {
                const hex = val.replace('#', '');
                colorAcc.rgba(
                  parseInt(hex.substring(0, 2), 16), parseInt(hex.substring(2, 4), 16),
                  parseInt(hex.substring(4, 6), 16), hex.length === 8 ? parseInt(hex.substring(6, 8), 16) : 255
                );
                continue;
              }
            }
            // Image URL
            if (val) applyImageProperty(inst, key, val, itemData);
          } else if (val && typeof val === 'object' && 'r' in val) {
            // RGBA color object
            const colorAcc = inst.color(key);
            if (colorAcc) colorAcc.rgba(
              Math.round(val.r), Math.round(val.g), Math.round(val.b),
              val.a !== undefined ? Math.round(val.a * 255) : 255
            );
          }
        } catch {}
      }
    }

    // Image before/after pair: new picture -> "<key>", previous -> "<key>__",
    // then fire the "<key>Update__" trigger so the item state machine can crossfade.
    function applyImageProperty(inst, key, rawUrl, itemData) {
      const imgAcc = inst.image(key);
      if (!imgAcc) return;
      const url = normalizeImageUrl(rawUrl);
      const instance = widgetState.r;
      const runtime = window.rive;

      let seen = instanceImageUrls.get(inst);
      if (!seen) { seen = {}; instanceImageUrls.set(inst, seen); }
      if (seen[key] === url) return;

      const itemKey = resolveItemKey(itemData);
      const histKey = itemKey ? itemKey + "|" + key : null;
      const prevUrl = histKey ? imageUrlHistory[histKey] : seen[key];
      const isChange = prevUrl !== undefined && prevUrl !== url;

      (async () => {
        try {
          const beforeAcc = inst.image(key + "__");
          const trigger = inst.trigger ? inst.trigger(key + "Update__") : null;
          if (isChange) {
            const fetchOld = beforeAcc ? decodeImageFromUrl(prevUrl, runtime).catch(() => null) : Promise.resolve(null);
            const [oldImage, newImage] = await Promise.all([fetchOld, decodeImageFromUrl(url, runtime)]);
            if (instance !== widgetState.r) return;
            if (beforeAcc && oldImage) beforeAcc.value = oldImage;
            imgAcc.value = newImage;
            if (trigger && typeof trigger.trigger === "function") trigger.trigger();
          } else {
            const image = await decodeImageFromUrl(url, runtime);
            if (instance !== widgetState.r) return;
            imgAcc.value = image;
            if (beforeAcc) beforeAcc.value = image;
          }
          seen[key] = url;
          if (histKey) imageUrlHistory[histKey] = url;
          resumeAfterImageUpdate(instance);
        } catch {}
      })();
    }

    function getAllViewModelProperties(riveInst) {
      const normalProps = {};
      const globalProps = {};
      const vmMetadata = {};
      widgetState.dataBoundFontProperties = {};

      let globalViewModelNames = [];
      try {
        if (typeof riveInst.globalViewModelNames === "function") {
          globalViewModelNames = Array.from(riveInst.globalViewModelNames() || [])
            .filter((name) => typeof name === "string" && name.length > 0);
        }
      } catch {}
      const globalNameSet = new Set(globalViewModelNames);

      function findVMNameForInstance(instance) {
        if (!instance) return null;
        try {
          if (instance.viewModelName) return instance.viewModelName;
          const instanceProps = instance.properties;
          const matches = [];
          for (let i = 0; i < riveInst.viewModelCount; i++) {
            const vm = riveInst.viewModelByIndex(i);
            if (!vm) continue;
            const vmProps = vm.properties;
            if (vmProps.length !== instanceProps.length) continue;
            if (instanceProps.every(ip => vmProps.find(vp => vp.name === ip.name && vp.type === ip.type))) matches.push(vm.name);
          }
          if (matches.length === 1) return matches[0];
        } catch {}
        return null;
      }

      let defaultVM = null;
      let mainInstance = null;
      try {
        defaultVM = riveInst.defaultViewModel();
        mainInstance = riveInst.viewModelInstance;
      } catch {}

      // autoBind already chose the selected artboard's authored instance.
      // Only create a fallback from that same definition when none was bound.
      if (defaultVM && !mainInstance && !globalNameSet.has(defaultVM.name)) {
        try {
          mainInstance = defaultVM.defaultInstance() || defaultVM.instance();
          if (mainInstance) riveInst.bindViewModelInstance(mainInstance);
        } catch (error) {
          console.warn("[RiveWidget] artboard View Model binding failed", { viewModel: defaultVM.name, error });
        }
      }

      function propertyAccessor(instance, type, path) {
        try {
          switch (type) {
            case "string":   return instance.string(path);
            case "number":   return instance.number(path);
            case "boolean":  return instance.boolean(path);
            case "trigger":  return instance.trigger(path);
            case "color":    return instance.color(path);
            case "image":    return instance.image(path);
            case "font":     return instance.font(path);
            case "enumType": return instance.enum(path);
            case "artboard": return instance.artboard(path);
            case "list":     return instance.list(path);
            default:          return null;
          }
        } catch {
          return null;
        }
      }

      function collectProperties(rootVM, rootInstance, options) {
        if (!rootInstance) return;
        const rootName = findVMNameForInstance(rootInstance) || (rootVM && rootVM.name) || "Main";

        function sameInstance(a, b) {
          if (a === b) return true;
          try {
            const an = a.nativeInstance, bn = b.nativeInstance;
            return !!(an && bn && (an === bn || (typeof an.isAliasOf === "function" && an.isAliasOf(bn))));
          } catch { return false; }
        }

        function processViewModel(instance, pathPrefix, parentVMName, ancestors, internalParent) {
          if (!instance) return;
          // A repeated definition can be a valid child instance. Stop only a
          // cycle of actual instances; allow the same child in sibling paths.
          if (ancestors.some(parent => sameInstance(parent, instance)) || ancestors.length >= 64) {
            console.warn("[RiveWidget] cyclic or excessively deep View Model path skipped", { path: pathPrefix });
            return;
          }
          const vmName = findVMNameForInstance(instance) || (pathPrefix ? "Nested" : rootName);
          const nextAncestors = [...ancestors, instance];
          if (!options.isGlobal) {
            vmMetadata[pathPrefix] = {
              vmName, parentVMName,
              parentProp: pathPrefix.split("/").pop() || null,
              path: pathPrefix,
            };
          }

          for (const property of instance.properties) {
            const propertyPath = pathPrefix ? `${pathPrefix}/${property.name}` : property.name;
            const internal = internalParent || property.name.includes("__");

            if (property.type === "viewModel") {
              let nestedInstance = null;
              try {
                nestedInstance = instance.viewModel(property.name);
              } catch {}
              if (nestedInstance) {
                processViewModel(nestedInstance, propertyPath, vmName, nextAncestors, internal);
              } else if (!internal) {
                console.warn("[RiveWidget] nested View Model has no bound instance", { path: propertyPath });
              }
              continue;
            }

            const propertyType = property.type === "enum" ? "enumType" : property.type;
            const accessor = propertyAccessor(rootInstance, propertyType, propertyPath);
            if (!accessor) continue;

            const propKey = propertyPath.replace(/\//g, "_");
            const storageKey = options.isGlobal
              ? `global:${options.viewModelName}:${propertyPath}`
              : propertyPath;
            const propData = {
              type: propertyType,
              accessor,
              path: propertyPath,
              ownerInstance: rootInstance,
              propertyName: property.name,
              parentPath: pathPrefix,
              vmName,
              rootVMName: rootName,
              internal,
              // Retain existing Singular IDs except where paths collide.
              fieldId: propertyType === "font" ? dataBoundFontFieldId(propKey) : toAlphanumericId(propKey),
            };

            if (options.isGlobal) {
              propData.isGlobal = true;
              propData.globalViewModelName = options.viewModelName;
              propData.displayName = pathPrefix
                ? `${pathPrefix.replace(/\//g, " · ")} · ${property.name}`
                : property.name;
              propData.fieldId = globalViewModelFieldId(
                options.viewModelName,
                propertyPath,
                propertyType === "font"
              );
            }

            if (propertyType === "enumType" && accessor.values) propData.enumValues = accessor.values;
            if (propertyType === "list") {
              propData.addedInstances = [];
              if ((accessor.length != null ? accessor.length : 0) > 0) {
                try {
                  const detected = findVMNameForInstance(accessor.instanceAt(0));
                  if (detected) propData.itemVMName = detected;
                } catch {}
              }
            }
            options.target[storageKey] = propData;
          }
        }

        processViewModel(rootInstance, "", null, [], false);
      }

      // Discover globals after any main-instance rebind so these accessors point
      // at the final auto-bound Global View Model instances.
      const discoveredGlobalNames = [];
      for (const viewModelName of globalViewModelNames) {
        let vm = null;
        let instance = null;
        try { vm = riveInst.viewModelByName(viewModelName); } catch {}
        try { instance = riveInst.globalViewModelInstance(viewModelName); } catch {}
        const beforeCount = Object.keys(globalProps).length;
        collectProperties(vm, instance, {
          isGlobal: true,
          viewModelName,
          target: globalProps,
        });
        if (Object.keys(globalProps).length > beforeCount) discoveredGlobalNames.push(viewModelName);
      }

      if (mainInstance) {
        collectProperties(defaultVM, mainInstance, {
          isGlobal: false,
          viewModelName: findVMNameForInstance(mainInstance) || (defaultVM && defaultVM.name),
          target: normalProps,
        });
      }

      const props = { ...globalProps, ...normalProps };
      const idCounts = new Map();
      const reservedIds = new Set(["riveartboard", "rivestatemachineselect", "rive_file_url", "rive_layout", "rive_renderer", "show_fps"]);
      for (const prop of Object.values(props)) {
        if (!prop.internal) idCounts.set(prop.fieldId, (idCounts.get(prop.fieldId) || 0) + 1);
      }
      const usedIds = new Set([...reservedIds, ...idCounts.keys()]);
      for (const [name, prop] of Object.entries(props)) {
        if (prop.internal) continue;
        if (idCounts.get(prop.fieldId) > 1 || reservedIds.has(prop.fieldId) || !prop.fieldId) {
          const base = prop.fieldId || "riveproperty";
          const qualifiedPath = `${prop.rootVMName}:${name}`;
          let candidate = `${base}${stableIdHash(qualifiedPath)}`;
          let suffix = 0;
          while (usedIds.has(candidate)) candidate = `${base}${stableIdHash(`${qualifiedPath}:${++suffix}`)}`;
          prop.fieldId = candidate;
          usedIds.add(candidate);
        }
        if (prop.type === "font") {
          widgetState.dataBoundFontProperties[prop.fieldId] = {
            accessor: prop.accessor, propertyName: name, path: prop.path,
            globalViewModelName: prop.globalViewModelName || null,
          };
        }
      }

      widgetState._findVMNameForInstance = findVMNameForInstance;
      return {
        props,
        vmMetadata,
        defaultVMName: findVMNameForInstance(mainInstance) || (defaultVM ? defaultVM.name : ""),
        globalViewModelNames: discoveredGlobalNames,
      };
    }

    // =========================================================================
    // Property handlers — type-specific update logic
    // =========================================================================

    function handleScalarUpdate(prop, value) {
      if (value !== prop.accessor.value) prop.accessor.value = value;
    }

    function handleImageUpdate(name, prop, imageUrl) {
      if (!imageUrl || imageUrl === "") return;
      imageUrl = normalizeImageUrl(imageUrl);
      if (prop.pendingImageUrl === imageUrl) return;
      const requestGeneration = (prop.imageRequestGeneration || 0) + 1;
      prop.imageRequestGeneration = requestGeneration;
      prop.pendingImageUrl = imageUrl;
      // A return to the applied URL must also cancel a pending different URL.
      if (prop.currentImageUrl === imageUrl) {
        prop.pendingImageUrl = null;
        return;
      }
      const instance = widgetState.r;
      const runtime = window.rive;
      return (async () => {
        try {
          const image = await decodeImageFromUrl(imageUrl, runtime);
          if (instance !== widgetState.r || requestGeneration !== prop.imageRequestGeneration) return;
          prop.accessor.value = image;
          prop.currentImageUrl = imageUrl;
          resumeAfterImageUpdate(instance);
        } catch (error) {
          if (instance === widgetState.r && requestGeneration === prop.imageRequestGeneration) {
            console.warn("[RiveWidget] image apply failed:", { name, path: prop.path, error });
          }
        } finally {
          if (requestGeneration === prop.imageRequestGeneration) prop.pendingImageUrl = null;
        }
      })();
    }

    function handleEnumUpdate(prop, selectedIndex) {
      const index = parseInt(selectedIndex);
      if (prop.enumValues[index]) {
        const enumValueName = prop.enumValues[index];
        if (prop.accessor.value !== enumValueName) prop.accessor.value = enumValueName;
      }
    }

    function handleArtboardUpdate(prop, selectedIndex) {
      const index = parseInt(selectedIndex);
      const file = widgetState.r ? widgetState.r.file : undefined;
      if (file && index >= 0 && index < file.artboardCount()) {
        const artboardObj = file.artboardByIndex(index);
        if (artboardObj && widgetState.fileUrl) {
          const artboardName = artboardObj.name;
          const riveFile = new rive.RiveFile({
            src: widgetState.fileUrl,
            onLoad: () => {
              try { const ab = riveFile.getArtboard(artboardName); if (ab) prop.accessor.value = ab; }
              catch { }
            },
          });
          riveFile.init();
        }
      }
    }

    function handleColorUpdate(prop, colorData) {
      if (typeof colorData === "string" && colorData.startsWith("#")) {
        const hex = colorData.replace("#", "");
        prop.accessor.rgba(
          parseInt(hex.substring(0, 2), 16), parseInt(hex.substring(2, 4), 16),
          parseInt(hex.substring(4, 6), 16), hex.length === 8 ? parseInt(hex.substring(6, 8), 16) : 255
        );
      } else if (colorData && typeof colorData === "object" && "r" in colorData) {
        prop.accessor.rgba(
          Math.round(colorData.r), Math.round(colorData.g), Math.round(colorData.b),
          colorData.a !== undefined ? Math.round(colorData.a * 255) : 255
        );
      }
    }

    // Stable key for an item payload, used to match items to instances across reorders.
    function resolveItemKey(item) {
      if (!item || typeof item !== 'object') return null;
      const name = item.name != null ? String(item.name) : '';
      if (name) return 'n:' + name;
      const id = item.id != null ? String(item.id) : '';
      if (id) return 'i:' + id;
      return null;
    }

    // Same stable key, read from a live Rive instance.
    function resolveInstanceKey(inst) {
      if (!inst) return null;
      try { const a = inst.string('name'); if (a && a.value) return 'n:' + String(a.value); } catch {}
      try { const a = inst.string('id');   if (a && a.value) return 'i:' + String(a.value); } catch {}
      return null;
    }

    // Reorders live instances to match `items` via list.swap(). No-op unless every
    // item has a stable name/id key that matches its instance.
    function tryReorderInstancesToIncomingOrder(listAcc, items, instanceMap) {
      const length = listAcc.length != null ? listAcc.length : 0;
      if (length !== items.length || length < 2) return;

      const current = [];
      const positionByKey = new Map();
      for (let i = 0; i < length; i++) {
        let inst;
        try { inst = listAcc.instanceAt(i); } catch {}
        const key = resolveInstanceKey(inst);
        if (!inst || !key || positionByKey.has(key)) return;
        current[i] = inst;
        positionByKey.set(key, i);
      }

      const desiredKeys = items.map(resolveItemKey);
      if (desiredKeys.some(k => !k)) return;
      if (new Set(desiredKeys).size !== desiredKeys.length) return;
      if (!desiredKeys.every(k => positionByKey.has(k))) return;

      for (let i = 0; i < desiredKeys.length; i++) {
        const desiredKey = desiredKeys[i];
        const currentPos = positionByKey.get(desiredKey);
        if (currentPos === i) continue;

        const desiredInst = current[currentPos];
        const displacedInst = current[i];
        const displacedKey = resolveInstanceKey(displacedInst);

        try { listAcc.swap(i, currentPos); } catch { return; }

        current[i] = desiredInst;
        current[currentPos] = displacedInst;
        positionByKey.set(desiredKey, i);
        if (displacedKey) positionByKey.set(displacedKey, currentPos);
      }

      instanceMap.clear();
      for (let i = 0; i < length; i++) {
        if (current[i]) instanceMap.set(i, current[i]);
      }
    }

    function handleListUpdate(prop, rawData) {
      const rawStr = typeof rawData === 'string' ? rawData : JSON.stringify(rawData);

      let items;
      try {
        const parsed = typeof rawData === 'string' ? JSON.parse(rawData) : rawData;
        items = Array.isArray(parsed) ? parsed : [parsed];
      } catch (error) {
        console.warn("[RiveWidget:list] failed to parse payload", { path: prop.path, error });
        return;
      }

      const vmi = prop.ownerInstance || widgetState.r.viewModelInstance;
      if (!vmi) return;
      var _listResult = vmi.list(prop.path); const listAcc = _listResult != null ? _listResult : prop.accessor;

      // instanceMap: logical-index → instance, so writes hit the right instance even if the sort script reorders mid-loop.
      if (!prop.instanceMap) prop.instanceMap = new Map();

      let currentLength = listAcc.length != null ? listAcc.length : 0;
      const newLength = items.length;
      const dataUnchanged = prop._lastListData === rawStr;

      // First update: clear authored/default instances so items re-add in Singular's order.
      if (prop.instanceMap.size === 0 && currentLength > 0) {
        for (let i = currentLength - 1; i >= 0; i--) {
          try { listAcc.removeInstanceAt(i); } catch {}
        }
        currentLength = 0;
      }

      if (!dataUnchanged && currentLength > newLength) {
        let oldItems = [];
        if (prop._lastListData) {
          try { oldItems = JSON.parse(prop._lastListData); } catch {}
        }

        let removedByKey = false;
        if (oldItems.length === currentLength) {
          const newKeySet = new Set();
          for (const item of items) { const k = resolveItemKey(item); if (k) newKeySet.add(k); }

          const toRemove = [];
          for (let i = 0; i < oldItems.length; i++) {
            const key = resolveItemKey(oldItems[i]);
            if (key && !newKeySet.has(key)) toRemove.push({ logicalIdx: i, key });
          }

          if (toRemove.length > 0 && toRemove.length === currentLength - newLength) {
            const toRemoveWithPos = [];
            for (const { logicalIdx, key } of toRemove) {
              let rivePos = -1;
              const rlen = listAcc.length != null ? listAcc.length : 0;
              for (let i = 0; i < rlen; i++) {
                try { if (resolveInstanceKey(listAcc.instanceAt(i)) === key) { rivePos = i; break; } } catch {}
              }
              toRemoveWithPos.push({ logicalIdx, rivePos });
            }

            toRemoveWithPos.sort((a, b) => b.rivePos - a.rivePos);
            for (const { rivePos } of toRemoveWithPos) {
              if (rivePos >= 0) try { listAcc.removeInstanceAt(rivePos); } catch {}
            }

            const removedSet = new Set(toRemoveWithPos.map(x => x.logicalIdx));
            const newMap = new Map();
            let newIdx = 0;
            for (let oldIdx = 0; oldIdx < currentLength; oldIdx++) {
              if (!removedSet.has(oldIdx)) {
                const inst = prop.instanceMap.get(oldIdx);
                if (inst !== undefined) newMap.set(newIdx, inst);
                newIdx++;
              }
            }
            prop.instanceMap = newMap;
            currentLength = newLength;
            removedByKey = true;
          }
        }

        if (!removedByKey) {
          for (let i = currentLength - 1; i >= newLength; i--) {
            try { listAcc.removeInstanceAt(i); } catch {}
            prop.instanceMap.delete(i);
          }
          currentLength = newLength;
        }
      }

      // Reorder to incoming order even when data is unchanged (restores the no-sort
      // order after leaving a stat-sort mode). No-op if already ordered.
      if (prop.instanceMap.size > 0 && currentLength === newLength && currentLength > 1) {
        tryReorderInstancesToIncomingOrder(listAcc, items, prop.instanceMap);
      }

      if (dataUnchanged) return;
      prop._lastListData = rawStr;

      // Snapshot instance refs so sort-induced reorders mid-loop don't misalign writes.
      const existingInstances = [];
      for (let i = 0; i < currentLength; i++) {
        try { existingInstances[i] = listAcc.instanceAt(i); } catch {}
      }

      const keepCount = Math.min(currentLength, newLength);
      for (let i = 0; i < keepCount; i++) {
        const inst = prop.instanceMap.has(i) ? prop.instanceMap.get(i) : existingInstances[i];
        if (inst) {
          try { applyPropsToInstance(inst, items[i]); } catch {}
          prop.instanceMap.set(i, inst);
        }
      }

      if (!prop.addedInstances) prop.addedInstances = [];
      for (let i = currentLength; i < newLength; i++) {
        const item = items[i];
        const vmName = item._vm != null ? item._vm : prop.itemVMName;
        if (!vmName) {
          console.warn("[RiveWidget:list] cannot add item: item ViewModel name unknown", {
            index: i,
            hint: "ensure the Rive list has at least one default item, or include a _vm field in each item"
          });
          continue;
        }
        let vm, inst;
        try { vm = widgetState.r.viewModelByName(vmName); } catch {}
        try { inst = vm ? vm.instance() : undefined; } catch {}
        if (!inst) {
          console.warn("[RiveWidget:list] could not create item instance", { index: i, vmName });
          continue;
        }
        applyPropsToInstance(inst, item);
        try {
          listAcc.addInstance(inst);
          prop.addedInstances.push(inst);
          prop.instanceMap.set(i, inst);
        } catch (error) {
          console.warn("[RiveWidget:list] addInstance failed", { index: i, error });
        }
      }
    }

    // =========================================================================
    // UI Generator — build dynamic Singular UI model
    // =========================================================================

    function getAvailableArtboards() {
      const artboards = [];
      const file = widgetState.r ? widgetState.r.file : undefined;
      if (!file) return artboards;
      const count = file.artboardCount();
      for (let i = 0; i < count; i++) {
        const ab = file.artboardByIndex(i);
        if (ab) {
          try { artboards.push(typeof ab.name === "function" ? ab.name() : ab.name); }
          finally { if (typeof ab.delete === "function") ab.delete(); }
        }
      }
      return artboards;
    }

    function getCurrentArtboardIndex(availableArtboards) {
      const file = widgetState.r ? widgetState.r.file : undefined;
      if (!file) return 0;
      const defaultArtboard = file.defaultArtboard();
      let defaultName = null;
      if (defaultArtboard) {
        try { defaultName = typeof defaultArtboard.name === "function" ? defaultArtboard.name() : defaultArtboard.name; }
        finally { if (typeof defaultArtboard.delete === "function") defaultArtboard.delete(); }
      }
      for (let i = 0; i < availableArtboards.length; i++) {
        if (availableArtboards[i] === widgetState.artboardName) return i;
        if (!widgetState.artboardName && availableArtboards[i] === defaultName) return i;
      }
      return 0;
    }

    function addArtboardField(fields, artboards, currentIndex) {
      if (artboards.length === 0) return;
      widgetState._lastArtboardSelection = currentIndex.toString();
      fields.push({
        id: "riveartboard", type: "selection", title: "Artboard",
        defaultValue: currentIndex.toString(),
        selections: artboards.map((name, i) => ({ id: i.toString(), title: name })),
      });
    }

    function addStateMachineField(fields) {
      const names = widgetState.r ? widgetState.r.stateMachineNames : undefined;
      if (!names || names.length === 0) return;
      // Snapshot the machine running on this artboard, not a previous artboard.
      widgetState._lastStateMachineSelection = widgetState.stateMachineName
        ? (widgetState.stateMachineIndex || 0).toString()
        : null;
      fields.push({
        id: "rivestatemachineselect", type: "selection", title: "State Machine",
        defaultValue: (widgetState.stateMachineIndex || 0).toString(),
        selections: names.map((name, i) => ({ id: i.toString(), title: name })),
      });
    }

    function resolveGroupInfo(prop) {
      const path = prop.parentPath || "";
      const metadata = widgetState.vmMetadata[path];
      return {
        groupKey: path,
        viewModelName: prop.vmName || (metadata && metadata.vmName) || widgetState.defaultVMName || "Main",
        parentPropertyName: metadata ? metadata.parentProp : null,
        path,
      };
    }

    function buildArtboardSelections(prop, availableArtboards) {
      let selectedId = "0", defaultValue = "0", selections;
      if (availableArtboards.length > 0) {
        const currentArtboardName = prop.accessor.value;
        const filtered = availableArtboards
          .map((artboardName, originalIndex) => ({ artboardName, originalIndex }))
          .filter(item => item.artboardName !== widgetState.artboardName);
        if (filtered.length > 0) {
          selections = filtered.map(item => {
            if (item.artboardName === currentArtboardName) selectedId = item.originalIndex.toString();
            return { id: item.originalIndex.toString(), title: item.artboardName };
          });
          defaultValue = selectedId;
        }
      }
      return { defaultValue, selections };
    }

    function buildListDefaultValue(prop) {
      const items = [];
      for (let i = 0; i < (prop.accessor.length != null ? prop.accessor.length : 0); i++) {
        try {
          const item = prop.accessor.instanceAt(i);
          if (item) {
            var _fnResult = widgetState._findVMNameForInstance ? widgetState._findVMNameForInstance(item) : null; const vmName = _fnResult != null ? _fnResult : prop.itemVMName;
            if (vmName && !prop.itemVMName) prop.itemVMName = vmName;
            items.push({ ...readInstanceProperties(item) });
          }
        } catch {}
      }
      return items.length > 0 ? JSON.stringify(items, null, 2) : "[]";
    }

    function buildFieldForProperty(name, displayName, prop, availableArtboards) {
      let fieldType = prop.type, defaultValue = "", selections;
      const fieldId = prop.fieldId || toAlphanumericId(name);

      switch (prop.type) {
        case "trigger":  fieldType = "button"; break;
        case "string":   fieldType = "text";     defaultValue = prop.accessor.value != null ? prop.accessor.value : ""; break;
        case "number":   fieldType = "number";   defaultValue = prop.accessor.value != null ? prop.accessor.value : 0; break;
        case "boolean":  fieldType = "checkbox"; defaultValue = prop.accessor.value != null ? prop.accessor.value : false; break;
        case "image":    fieldType = "image"; break;
        case "font":
          fieldType = "metricfont";
          defaultValue = {
            fontData: widgetState.metricFontData[fieldId] || {
              family: "Inter", weight: "400", subset: "auto"
            }
          };
          break;
        case "color":    defaultValue = riveColorValueToRGBA(prop.accessor.value); break;
        case "enumType":
          fieldType = "selection";
          if (prop.enumValues && prop.enumValues.length) {
            selections = prop.enumValues.map((v, i) => ({ id: i.toString(), title: v }));
            const currentIndex = prop.enumValues.indexOf(prop.accessor.value);
            defaultValue = (currentIndex >= 0 ? currentIndex : 0).toString();
          } else defaultValue = "0";
          break;
        case "artboard":
          fieldType = "selection";
          ({ defaultValue, selections } = buildArtboardSelections(prop, availableArtboards));
          break;
        case "list":
          fieldType = "json"; defaultValue = buildListDefaultValue(prop);
          break;
        default: break;
      }

      const field = { id: fieldId, type: fieldType, title: displayName, defaultValue };
      if (fieldType === "number") field.step = "0.1";
      if (fieldType === "json") { field.width = "350"; field.height = "200"; }
      if (selections) field.selections = selections;
      return field;
    }

    function buildGroups(availableArtboards, globalGroupedProperties, groupedProperties, viewModelParentInfo) {
      const groups = [];

      if (availableArtboards.length > 0) {
        const childIds = ["riveartboard"];
        if (widgetState.r && widgetState.r.stateMachineNames && widgetState.r.stateMachineNames.length > 0) childIds.push("rivestatemachineselect");
        groups.push({ id: "artboardgroup", title: "Artboard Selection", width: "double", toolTip: "Select the artboard to display", childIds });
      }

      // Global View Models are file-wide and intentionally appear before the
      // artboard-specific and nested View Model groups.
      for (const viewModelName of widgetState.globalViewModelNames) {
        const childIds = globalGroupedProperties[viewModelName];
        if (!childIds || childIds.length === 0) continue;
        groups.push({
          id: globalViewModelGroupId(viewModelName),
          title: `${viewModelName} : Global View Model`,
          width: "double",
          toolTip: `File-wide properties from ${viewModelName}`,
          childIds,
        });
      }

      for (const [groupKey, childIds] of Object.entries(groupedProperties)) {
        const groupInfo = viewModelParentInfo[groupKey];
        const vmName = groupInfo.vmName;
        const path = groupInfo.path;
        const groupTitle = path ? `${path.replace(/\//g, " → ")} (${vmName})` : vmName;
        const groupIdKey = `${widgetState.defaultVMName}:${path}`;
        groups.push({ id: `rivevm${toAlphanumericId(groupIdKey)}${stableIdHash(groupIdKey)}group`, title: `${groupTitle} : View Model`, width: "double", toolTip: `Properties from ${vmName}`, childIds });
      }
      return groups;
    }

    function addReferencedFontFields(fields, groups) {
      const fontAssets = Object.values(widgetState.referencedFontAssets);
      if (fontAssets.length === 0) return;

      const fontFieldIds = [];
      for (const { fieldId, assetName } of fontAssets) {
        const displayName = assetName.replace(/\.[^.]+$/, "");
        const stored = widgetState.metricFontData[fieldId];
        const defaultValue = stored
          ? { fontData: stored }
          : { fontData: { family: parseFontFamilyFromAsset(assetName), weight: "400", subset: "auto" } };

        fields.push({ id: fieldId, type: "metricfont", title: displayName, defaultValue });
        fontFieldIds.push(fieldId);
      }

      groups.push({
        id: "rivefontgroup",
        title: "Fonts",
        width: "double",
        toolTip: "Font overrides for referenced text assets in the Rive file",
        activeId: "",
        childIds: fontFieldIds,
      });
    }

    function addReferencedAudioFields(fields, groups) {
      const audioAssets = Object.values(widgetState.referencedAudioAssets);
      console.log("[RiveWidget][audio] addReferencedAudioFields — known audio assets at UI build:", audioAssets.map(a => a.fieldId));
      if (audioAssets.length === 0) return;

      const audioFieldIds = [];
      for (const { fieldId, assetName } of audioAssets) {
        const displayName = assetName.replace(/\.[^.]+$/, "");
        const defaultValue = widgetState.audioAssetUrls[fieldId] || "";
        fields.push({ id: fieldId, type: "audio", title: displayName, defaultValue });
        audioFieldIds.push(fieldId);
      }

      groups.push({
        id: "riveaudiogroup",
        title: "Audio",
        width: "double",
        toolTip: "Audio overrides for referenced audio assets in the Rive file",
        activeId: "",
        childIds: audioFieldIds,
      });
    }

    function generateUIModel() {
      const fields = [];
      const globalGroupedProperties = {};
      const groupedProperties = {};
      const viewModelParentInfo = {};

      const availableArtboards = getAvailableArtboards();
      const currentArtboardIndex = getCurrentArtboardIndex(availableArtboards);

      addArtboardField(fields, availableArtboards, currentArtboardIndex);
      addStateMachineField(fields);

      // Dynamic property fields
      for (const [name, prop] of Object.entries(widgetState.riveProps)) {
        if (prop.internal) continue;
        let displayName;
        let groupKey;
        if (prop.isGlobal) {
          displayName = prop.displayName;
          groupKey = prop.globalViewModelName;
        } else {
          displayName = prop.propertyName;
          const groupInfo = resolveGroupInfo(prop);
          groupKey = groupInfo.groupKey;
          if (!viewModelParentInfo[groupKey]) {
            viewModelParentInfo[groupKey] = {
              vmName: groupInfo.viewModelName,
              parentProp: groupInfo.parentPropertyName,
              path: groupInfo.path,
            };
          }
        }
        const field = buildFieldForProperty(name, displayName, prop, availableArtboards);
        if (field) {
          fields.push(field);
          const targetGroups = prop.isGlobal ? globalGroupedProperties : groupedProperties;
          if (!targetGroups[groupKey]) targetGroups[groupKey] = [];
          targetGroups[groupKey].push(field.id);
        }
      }

      const groups = buildGroups(availableArtboards, globalGroupedProperties, groupedProperties, viewModelParentInfo);
      addReferencedFontFields(fields, groups);
      addReferencedAudioFields(fields, groups);
      const uiModel = { fields, groups };
      SingularWidget.setCustomWidgetUI(uiModel);
    }

    // =========================================================================
    // Rive lifecycle
    // =========================================================================

    function initializeRive(fileUrl) {
      widgetState.riveReady = false;
      // Invalidate older prefetch/reload completions as well as older onLoad callbacks.
      widgetState._reloadGen = (widgetState._reloadGen || 0) + 1;
      const loadGen = (widgetState._loadGen = (widgetState._loadGen != null ? widgetState._loadGen : 0) + 1);
      let instance = null;

      // Watchdog: if onLoad never fires within 5s, retry once
      const watchdog = setTimeout(() => {
        if (!widgetState.riveReady && widgetState._loadGen === loadGen) {
          reloadRive(widgetState.fileUrl, "load-watchdog");
        }
      }, 5000);

      const riveConfig = {
        src: fileUrl,
        canvas: document.getElementById("canvas"),
        autoplay: true,
        autoBind: true,
        ...(widgetState.runtime === "webgl2" ? { useOffscreenRenderer: true } : {}),
        layout: new rive.Layout({ fit: rive.Fit[widgetState.layoutFit] }),
        enableFPSCounter: true,

        assetLoader: (asset, bytes) => {
          if (widgetState._loadGen !== loadGen) return false;
          try {
            console.log("[RiveWidget][assetLoader]", {
              name: asset.name,
              fileExtension: asset.fileExtension,
              isAudio: asset.isAudio,
              isFont: asset.isFont,
              isImage: asset.isImage,
              cdnUuid: asset.cdnUuid,
              bytesLength: bytes != null ? bytes.length : 0,
              riveReady: widgetState.riveReady,
            });
            // Let Rive handle hosted (CDN) and embedded assets
            if ((asset.cdnUuid != null ? asset.cdnUuid.length : 0) > 0 || (bytes != null ? bytes.length : 0) > 0) return false;

            if (asset.isFont) {
              const fieldId = fontAssetFieldId(asset.name);
              widgetState.referencedFontAssets[fieldId] = {
                asset,
                assetName: asset.name,
                fieldId,
              };
              // Start fetching immediately if font data is already available
              fetchAndApplyFont(fieldId);
              return true;
            }

            if (asset.isAudio) {
              const fieldId = audioAssetFieldId(asset.name);
              console.log("[RiveWidget][audio] registering audio asset", { fieldId, assetName: asset.name, storedUrl: widgetState.audioAssetUrls[fieldId] });
              widgetState.referencedAudioAssets[fieldId] = {
                asset,
                assetName: asset.name,
                fieldId,
              };
              const rawUrl = widgetState.audioAssetUrls[fieldId];
              const cached = rawUrl ? audioDecodedCache[normalizeAudioUrl(rawUrl)] : null;
              if (cached) {
                // Synchronous apply so artboard scripts see the audio at init
                asset.setAudioSource(cached);
                console.log("[RiveWidget][audio] setAudioSource from cache (sync) for", fieldId);
              } else {
                fetchAndApplyAudio(fieldId);
              }
              scheduleAssetUIRefresh();
              return true;
            }
          } catch { }
          return false;
        },

        onLoad: () => {
          clearTimeout(watchdog);
          if (widgetState._loadGen !== loadGen || widgetState.r !== instance) return;
          resizeCanvas();
          widgetState.artboardName = instance.activeArtboard || widgetState.artboardName;
          const pending = widgetState.pendingInitialValues || {};
          const artboardIndex = parseInt(pending.riveartboard, 10);
          if (Number.isInteger(artboardIndex) && artboardIndex >= 0 && artboardIndex < instance.file.artboardCount()) {
            const selected = instance.file.artboardByIndex(artboardIndex);
            let selectedName = null;
            if (selected) {
              try { selectedName = typeof selected.name === "function" ? selected.name() : selected.name; }
              finally { if (typeof selected.delete === "function") selected.delete(); }
            }
            if (selectedName && selectedName !== widgetState.artboardName) {
              widgetState.artboardName = selectedName;
              widgetState.stateMachineName = "";
              widgetState.stateMachineIndex = 0;
              // Resolve a newer/persisted selection before publishing the UI.
              // cleanup must remain outside the runtime's onLoad callback.
              setTimeout(() => {
                if (widgetState._loadGen === loadGen && widgetState.r === instance) reloadRive(fileUrl, "restore-artboard");
              }, 0);
              return;
            }
          }
          const machineNames = instance.stateMachineNames || [];
          const playingNames = instance.playingStateMachineNames || [];
          const savedMachineIndex = parseInt(pending.rivestatemachineselect, 10);
          const selectedMachine = machineNames[savedMachineIndex] || widgetState.stateMachineName || playingNames[0] || machineNames[0] || "";
          if (selectedMachine && !playingNames.includes(selectedMachine)) {
            widgetState.stateMachineName = selectedMachine;
            widgetState.stateMachineIndex = machineNames.indexOf(selectedMachine);
            setTimeout(() => {
              if (widgetState._loadGen === loadGen && widgetState.r === instance) reloadRive(fileUrl, "restore-state-machine");
            }, 0);
            return;
          }
          widgetState.stateMachineName = selectedMachine;
          const machineIndex = machineNames.indexOf(widgetState.stateMachineName);
          widgetState.stateMachineIndex = machineIndex >= 0 ? machineIndex : 0;

          try {
            console.log("[RiveWidget][audio] onLoad — registered audio assets:", Object.keys(widgetState.referencedAudioAssets), "| instance volume:", widgetState.r ? widgetState.r.volume : "n/a");
          } catch {}

          const vmData = getAllViewModelProperties(instance);
          widgetState.riveProps = vmData.props;
          widgetState.vmMetadata = vmData.vmMetadata;
          widgetState.defaultVMName = vmData.defaultVMName;
          widgetState.globalViewModelNames = vmData.globalViewModelNames;
          applyStoredDataBoundFonts();

          generateUIModel();
          console.info("[RiveWidget] View Model UI", {
            artboard: widgetState.artboardName,
            stateMachine: widgetState.stateMachineName,
            boundViewModel: vmData.defaultVMName || null,
            globalViewModels: vmData.globalViewModelNames,
            nestedPaths: Object.keys(vmData.vmMetadata).filter(Boolean),
            visibleProperties: Object.values(vmData.props).filter(prop => !prop.internal).length,
          });
          ensureFPSCounter(instance);
          widgetState.riveReady = true;

          // Guard: only show canvas if this is still the active load
          const genAtLoad = loadGen;
          setTimeout(() => {
            if (widgetState._loadGen === genAtLoad) {
              document.getElementById("canvas").classList.add("ready");
            }
          }, 400);

          if (widgetState.pendingInitialValues) {
            // Defer outside onLoad — cleanup() inside it freezes the WebGL2 offscreen renderer.
            setTimeout(() => {
              if (widgetState._loadGen !== loadGen || widgetState.r !== instance) return;
              const initialValues = widgetState.pendingInitialValues;
              widgetState.pendingInitialValues = null;
              if (initialValues) onSingularValue(initialValues);
            }, 0);
          }
        },

        onLoadError: (error) => {
          if (widgetState._loadGen === loadGen) console.warn("[RiveWidget] Rive load failed", { fileUrl, artboard: widgetState.artboardName, error });
        },
      };

      if (widgetState.artboardName) riveConfig.artboard = widgetState.artboardName;
      if (widgetState.stateMachineName) riveConfig.stateMachines = widgetState.stateMachineName;
      instance = new rive.Rive(riveConfig);
      widgetState.r = instance;
    }

    function reloadRive(fileUrl, reason) {
      console.warn("[RiveWidget] reloadRive", { reason: reason || "unspecified", fileUrl });
      widgetState._loadGen = (widgetState._loadGen || 0) + 1;
      widgetState.riveReady = false;
      document.getElementById("canvas").classList.remove("ready");
      widgetState.referencedFontAssets = {};
      widgetState.dataBoundFontProperties = {};
      widgetState.referencedAudioAssets = {};
      if (widgetState.r) { try { widgetState.r.cleanup(); } catch {} widgetState.r = null; }
      // Decode audio before the file loads so assetLoader can apply it
      // synchronously; a newer reload supersedes this one while waiting.
      const gen = (widgetState._reloadGen = (widgetState._reloadGen || 0) + 1);
      prefetchAudioAssets().finally(() => {
        if (widgetState._reloadGen === gen) initializeRive(fileUrl);
      });
    }

    // =========================================================================
    // Singular event handlers
    // =========================================================================

    function updateDynamicProperties(json) {
      for (const [name, prop] of Object.entries(widgetState.riveProps)) {
        if (prop.internal) continue;
        const id = prop.fieldId || toAlphanumericId(name);
        if (json[id] === undefined) continue;
        try {
          const value = json[id];
          switch (prop.type) {
            case "string": case "number": case "boolean": handleScalarUpdate(prop, value); break;
            case "image":    handleImageUpdate(name, prop, value); break;
            case "enumType": handleEnumUpdate(prop, value); break;
            case "artboard": handleArtboardUpdate(prop, value); break;
            case "color":    handleColorUpdate(prop, value); break;
            case "list":     handleListUpdate(prop, value); break;
          }
        } catch (error) {
          console.warn("[RiveWidget] property apply failed:", { name, id, path: prop.path, type: prop.type, error });
        }
      }
    }

    async function onSingularValue(json) {
      widgetState.pendingInitialValues = widgetState.pendingInitialValues
        ? { ...widgetState.pendingInitialValues, ...json }
        : { ...json };

      // Consumed rivefont* keys are deleted from pendingInitialValues to avoid a reload loop.
      let fontDataChanged = false;
      const changedFontIds = [];
      for (const [key, value] of Object.entries(json)) {
        if (!key.startsWith("rivefont")) continue;
        var _fontDataRaw = value != null ? value.fontData : undefined; const fontData = _fontDataRaw != null ? _fontDataRaw : value;
        if (!fontData || !fontData.family) continue;
        const incoming = {
          family: fontData.family,
          weight: String(fontData.weight != null ? fontData.weight : "400"),
          subset: fontData.subset != null ? fontData.subset : "auto",
        };
        const existing = widgetState.metricFontData[key];
        const changed = !existing ||
          existing.family !== incoming.family ||
          existing.weight !== incoming.weight ||
          existing.subset !== incoming.subset;
        widgetState.metricFontData[key] = incoming;
        if (changed && (widgetState.referencedFontAssets[key] || widgetState.dataBoundFontProperties[key])) {
          fontDataChanged = true;
          changedFontIds.push(key);
        }
        if (widgetState.pendingInitialValues) delete widgetState.pendingInitialValues[key];
      }
      let audioUrlChanged = false;
      for (const [key, value] of Object.entries(json)) {
        if (!key.startsWith("riveaudio")) continue;
        console.log("[RiveWidget][audio] onSingularValue key:", key, "raw value:", JSON.stringify(value));
        // "audio" field type is undocumented — tolerate both string and object payloads
        let url = "";
        if (typeof value === "string") url = value;
        else if (value && typeof value === "object") url = value.url || value.src || value.audio || value.file || "";
        const existing = widgetState.audioAssetUrls[key];
        const changed = existing !== url;
        widgetState.audioAssetUrls[key] = url;
        console.log("[RiveWidget][audio] extracted url:", url, "| previous:", existing, "| changed:", changed, "| assetRegistered:", !!widgetState.referencedAudioAssets[key]);
        if (changed && widgetState.referencedAudioAssets[key]) audioUrlChanged = true;
        if (widgetState.pendingInitialValues) delete widgetState.pendingInitialValues[key];
      }
      // Audio changes still require a reload so assetLoader can apply the decoded
      // source synchronously. Fonts are swapped live below and do not reload Rive.
      if (audioUrlChanged && widgetState.fileUrl) {
        console.log("[RiveWidget][audio] audio change → full Rive reload", { audioUrlChanged });
        reloadRive(widgetState.fileUrl, "audio-change");
        return;
      }

      // Runtime change
      if (json.rive_renderer !== undefined) {
        const desiredRuntime = json.rive_renderer !== false ? "webgl2" : "canvas";
        const needLoad = !widgetState.runtime || widgetState.runtime !== desiredRuntime || !window.rive;
        if (needLoad) {
          try { await toggleRiveRuntime(desiredRuntime); }
          catch (e) { return; }
        }
      }

      // File URL change
      if (json.rive_file_url !== undefined) {
        if (typeof json.rive_file_url === "string" && json.rive_file_url.endsWith(".riv")) {
          const newFileUrl = json.rive_file_url;
          if (newFileUrl !== widgetState.fileUrl) {
            widgetState.fileUrl = newFileUrl;
            if (json.rive_layout !== undefined) widgetState.layoutFit = widgetState.layoutOptions[parseInt(json.rive_layout, 10)] || "Contain";
            widgetState.artboardName = "";
            widgetState.stateMachineName = "";
            widgetState.stateMachineIndex = 0;
            if (!widgetState.r) initializeRive(newFileUrl); else reloadRive(newFileUrl, "file-url-change");
            return;
          }
        } else { return; }
      }

      // Initialize if URL is ready but no instance
      if (!widgetState.r && widgetState.fileUrl && widgetState.fileUrl.endsWith(".riv")) {
        initializeRive(widgetState.fileUrl);
        return;
      }

      // FPS toggle
      if (json.show_fps !== undefined) {
        widgetState.displayFpsCounter = json.show_fps === true;
        if (widgetState.r) ensureFPSCounter(widgetState.r);
      }

      // Layout change
      if (json.rive_layout !== undefined) {
        const newLayout = widgetState.layoutOptions[parseInt(json.rive_layout, 10)] || "Contain";
        if (newLayout !== widgetState.layoutFit) {
          widgetState.layoutFit = newLayout;
          if (widgetState.r && widgetState.fileUrl) { reloadRive(widgetState.fileUrl, "layout-change"); return; }
        }
      }

      // Artboard change
      if (json.riveartboard !== undefined && widgetState.r) {
        const artboardIndex = parseInt(json.riveartboard);
        const incomingSelection = isNaN(artboardIndex) ? "" : artboardIndex.toString();
        const selectionChanged = incomingSelection !== widgetState._lastArtboardSelection;
        widgetState._lastArtboardSelection = incomingSelection;
        const file = widgetState.r ? widgetState.r.file : undefined;
        if (selectionChanged && file && artboardIndex >= 0 && artboardIndex < file.artboardCount()) {
          const artboard = file.artboardByIndex(artboardIndex);
          if (artboard) {
            let newArtboard;
            try { newArtboard = typeof artboard.name === "function" ? artboard.name() : artboard.name; }
            finally { if (typeof artboard.delete === "function") artboard.delete(); }
            if (newArtboard !== widgetState.artboardName) {
              widgetState.artboardName = newArtboard;
              widgetState.stateMachineName = "";
              widgetState.stateMachineIndex = 0;
              if (widgetState.fileUrl) { reloadRive(widgetState.fileUrl, "artboard-change"); return; }
            }
          }
        }
      }

      // State machine change
      if (json.rivestatemachineselect !== undefined && widgetState.r) {
        const smIndex = parseInt(json.rivestatemachineselect);
        const incomingSelection = isNaN(smIndex) ? "" : smIndex.toString();
        const selectionChanged = incomingSelection !== widgetState._lastStateMachineSelection;
        widgetState._lastStateMachineSelection = incomingSelection;
        if (selectionChanged && !isNaN(smIndex) && smIndex >= 0 && smIndex < widgetState.r.stateMachineNames.length) {
          widgetState.stateMachineIndex = smIndex;
          var _smArr = widgetState.r.stateMachineNames; var _smVal = _smArr != null ? _smArr[smIndex] : undefined; const newName = _smVal != null ? _smVal : "";
          if (newName !== widgetState.stateMachineName) {
            widgetState.stateMachineName = newName;
            if (widgetState.fileUrl) { reloadRive(widgetState.fileUrl, "state-machine-change"); return; }
          }
        }
      }

      if (fontDataChanged) {
        await Promise.all(changedFontIds.map((fieldId) => fetchAndApplyFont(fieldId)));
      }

      if (!widgetState.r || !widgetState.riveReady) return;
      updateDynamicProperties(json);
    }

    function onSingularButtonClicked(action) {
      for (const [name, prop] of Object.entries(widgetState.riveProps)) {
        if (prop.internal) continue;
        const fieldId = prop.fieldId || toAlphanumericId(name);
        if (fieldId === action && prop && prop.type === "trigger") {
          prop.accessor.trigger();
          return;
        }
      }
    }

    // =========================================================================
    // Entry point
    // =========================================================================

    SingularWidget.init({
      onInit: async (json) => {
        console.info("[RiveWidget] Singular onInit");
        widgetState.pendingInitialValues = json;
        const layoutIndex = parseInt(json.rive_layout, 10);
        widgetState.layoutFit = (widgetState.layoutOptions && widgetState.layoutOptions[layoutIndex]) || widgetState.layoutFit || "Contain";
        if (json.show_fps !== undefined) widgetState.displayFpsCounter = json.show_fps;
        if (json.rive_renderer !== undefined) {
          const desiredRuntime = json.rive_renderer ? "webgl2" : "canvas";
          try {
            await toggleRiveRuntime(desiredRuntime);
          } catch {
            try { await toggleRiveRuntime("canvas"); } catch {}
          }
        }
        if (typeof json.rive_file_url === "string" && json.rive_file_url.endsWith(".riv")) {
          widgetState.fileUrl = json.rive_file_url;
          initializeRive(json.rive_file_url);
        }
      },
      onValue: onSingularValue,
      onButtonClicked: onSingularButtonClicked,
    });
    </script>
  </body>
</html>
